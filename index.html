<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MathQuest</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f8fc;--grid:#dfe4f5;--ink:#1c2340;--blue:#2b3fd6;--hl:#ffe14d;--ok:#1f9d55;--ko:#e5484d;--card:#fff;--mut:#6b7392}
@media(prefers-color-scheme:dark){:root{--bg:#141829;--grid:#232a47;--ink:#eef0fb;--blue:#7b8cff;--hl:#ffd93b;--card:#1d2340;--mut:#9aa3c7}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--ink);background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;min-height:100vh}
#app{max-width:1000px;margin:0 auto;padding:76px 16px 16px}#app.n{max-width:560px}
#top{display:none;position:fixed;top:0;left:0;right:0;z-index:10;align-items:center;gap:10px;background:var(--card);border-bottom:2px solid var(--ink);padding:8px 12px}
#top nav{display:flex;gap:6px;margin-left:auto}
.tb{font:inherit;background:none;border:0;color:var(--ink);cursor:pointer;padding:6px;border-radius:8px;font-size:1rem;white-space:nowrap}.tb:hover,.tb:focus-visible{background:var(--hl);color:#1c2340;outline:0}
.tb b{display:block;max-width:80px;overflow:hidden;text-overflow:ellipsis}
.lv{width:60px;font-size:.8rem}.lv .bar{height:8px}.lb{display:none}
@media(min-width:700px){.lb{display:inline}.lv{width:160px}.tb b{max-width:220px}}
.hs{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 6px 12px 0}.hs .card{flex:0 0 min(300px,82%);scroll-snap-align:start;margin:8px 0}
.nb{font:inherit;font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:6px;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:6px 9px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.nb .ic{font-size:1.15rem;line-height:1}.nb.pri{background:var(--blue);color:#fff}
.nb:hover,.nb:focus-visible{background:var(--hl);color:#1c2340;outline:0}.nb.out:hover,.nb.out:focus-visible{background:var(--ko);color:#fff}
.nb:active{transform:translate(2px,2px);box-shadow:none}
.ch{display:flex;flex-direction:column;gap:6px}.ch .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:flex;align-items:center;gap:8px}.pr .bar{flex:1}.pr span{font-size:.85rem;min-width:2.8em;text-align:right}
.st{min-height:3.4em}.st>div{margin:0!important}
.acts{display:flex;gap:6px;margin-top:auto}.acts .btn{flex:1;margin:0;padding:10px 6px;white-space:nowrap}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0}.sts>div{display:flex;flex-direction:column;align-items:flex-start;gap:3px}.sts .mut{font-size:.78rem}
.sc{white-space:nowrap}.ch .mut,.sts .mut{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.av{border-radius:50%;border:2px solid var(--ink);display:block;background:#fff}.av-b{padding:0!important}
.lv{font:inherit;color:var(--ink);background:none;border:0;cursor:pointer;text-align:left;padding:4px;border-radius:8px;position:relative}.lv:hover,.lv:focus-visible{background:var(--hl);color:#1c2340;outline:0}
.dot{position:absolute;top:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:var(--ko);border:2px solid var(--card)}
.rb{color:var(--ko);font-weight:700}.rub{font-weight:700;font-size:1.1rem}.stars{color:#e0a100;letter-spacing:2px;font-size:1.1rem}
.tabs{display:flex;flex-wrap:wrap;gap:4px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin:12px 0}
.item{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.item.eq{background:var(--hl);color:#1c2340}.item:disabled{opacity:.5;cursor:not-allowed}.item span{font-size:.85rem}
.lbx{overflow-x:auto;padding:8px}.lbg{display:grid;grid-template-columns:34px minmax(120px,1fr) 226px 64px 64px;gap:8px;align-items:center;min-width:590px;padding:6px 4px}
.lbr{border-top:1px solid var(--grid)}.lbr.me{background:var(--hl);color:#1c2340;border-radius:8px}.rk{font-size:1.3rem;text-align:center}
.who{display:flex;align-items:center;gap:8px;min-width:0}.who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dks{display:flex;gap:4px}.dks .sc{font-size:.72rem;padding:1px 6px}
.sorth{font:inherit;font-weight:700;background:none;border:0;color:var(--ink);cursor:pointer;padding:4px;border-radius:6px;text-align:left}.sorth.on{background:var(--hl);color:#1c2340}
.rt{display:flex;align-items:center;gap:8px}.rt .btn{margin:0}.promo{width:120px;margin:0;font-size:.8rem;padding:6px 8px;border-width:1px;text-transform:uppercase}.promo::placeholder{color:var(--mut)}
.card.qb{background:linear-gradient(135deg,#ff5a1f,#ff2e63);color:#fff}.qbt{display:block;font-size:1.55rem;font-weight:800;letter-spacing:.5px;line-height:1.1}.qbs{display:block;font-size:.95rem;font-weight:600;opacity:.95;margin-top:2px}.qb .btn.qbgo{font-size:1.05rem;padding:12px 6px}.qb .mut{color:#fff;opacity:.92}.qb .btn{background:#fff;color:#c43c00}
.ex table,.opt table{border-collapse:collapse;display:block;overflow-x:auto}.ex th,.ex td,.opt th,.opt td{border:1px solid var(--grid);padding:4px 8px;text-align:center}
.ex blockquote{border-left:4px dashed var(--blue);margin:8px 0;padding:2px 12px;color:var(--mut)}.ex pre{overflow-x:auto;background:var(--bg);padding:8px;border-radius:8px}.ex h5{margin:14px 0 4px}.qs{font-size:1.05rem;margin:6px 0 12px}
.corr{margin:10px 0}.cb{background:var(--grid);border-radius:10px;padding:4px 12px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.chips i{font-style:normal;font-size:.72rem;background:var(--grid);padding:1px 7px;border-radius:10px}
.xrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-top:1px solid var(--grid);padding:10px 4px;cursor:pointer}
.xrow:first-child{border-top:0}.xrow:hover,.xrow:focus-visible{background:var(--hl);color:#1c2340;outline:0}.xt{display:flex;flex-direction:column;gap:2px;min-width:0}.xr{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xs{font-size:.78rem;font-weight:700;white-space:nowrap;padding:2px 8px;border-radius:8px;border:2px solid var(--ink)}.s0{background:#e5484d;color:#fff}.s1{background:#f5a524;color:#1c2340}.s2{background:#1f9d55;color:#fff}
select{font:inherit;width:100%;padding:10px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:8px}
.chk{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}.chk.off{opacity:.5}input[type=checkbox]{width:20px;height:20px;padding:0;margin:0;accent-color:var(--blue)}
.lock{opacity:.55;border-style:dashed;box-shadow:none;text-align:center}
footer{margin:28px 0 8px;text-align:center;font-size:.8rem;color:var(--mut)}.lnk{font:inherit;background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer}
h1{font-size:2.2rem;font-weight:800;margin:.2em 0}h2{margin:.6em 0 .3em}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:16px;margin:12px 0;box-shadow:4px 4px 0 var(--ink)}
.btn{font:inherit;font-weight:600;background:var(--blue);color:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;margin:4px 4px 4px 0}
.btn.alt{background:var(--card);color:var(--ink)}.btn:focus-visible,input:focus-visible{outline:3px solid var(--hl)}
input{font:inherit;padding:10px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);width:100%;margin:4px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mut{color:var(--mut);font-size:.9rem}
.bar{height:12px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--card)}.bar i{display:block;height:100%;background:var(--hl)}
.opt{display:block;width:100%;text-align:left;font:inherit;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}
.opt.ok{background:var(--ok);color:#fff}.opt.ko{background:var(--ko);color:#fff}
.q{font-size:1.15rem;font-weight:600;margin:6px 0 12px}.flip{cursor:pointer;min-height:140px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.15rem}
.sc{color:#fff;padding:1px 8px;border-radius:6px;font-weight:700}.hl{background:var(--hl);color:#1c2340;padding:1px 6px;border-radius:4px;font-weight:700}.err{color:var(--ko);font-weight:600}
td,th{padding:6px;text-align:left}table{width:100%;border-collapse:collapse}tr.me{background:var(--hl);color:#1c2340}
@media(prefers-reduced-motion:no-preference){.pop{animation:p .3s}@keyframes p{from{transform:scale(.9)}}}
</style></head><body><div id="top"></div><div id="app">Chargement…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
// ====== À REMPLIR : Supabase > Project Settings > API ======
const SB={url:"https://djgbptxrgzjmvozilpou.supabase.co",key:"sb_publishable_n0T6saUF3tmygA3u2a-1OQ_6G-imFxD"}; // ex: url:"https://xxxx.supabase.co", key:"clé anon public"
// ===========================================================
const VERSION='1.9.1 · 27/11/2026',MASTER=3; // MASTER = niveau de boîte à atteindre pour qu'une carte soit maîtrisée
const A=document.getElementById('app'),day=()=>Math.floor(Date.now()/864e5);
const wk=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10)};
const lvl=x=>Math.floor(Math.sqrt(x/50))+1,need=l=>50*(l-1)*(l-1);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/\s|\\/g,'').replace(/π/g,'pi').replace(/[−–]/g,'-').replace(/²/g,'^2').replace(/[×·]/g,'*').replace(/δ/g,'delta');
const esc=s=>s.replace(/[<>&"]/g,'');
const R=(h,w)=>{A.className=w?'':'n';A.innerHTML=h;renderMathInElement(A,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})};
let QCM=[],EXOS=[],xfil='',QB={},nm=0,ev=false,P=null,packs=[],ALL=[],Q=[],qi=0,combo=0,gained=0,good=0,cur=null;

async function api(path,m='GET',b,h={}){const r=await fetch(SB.url+'/rest/v1/'+path,{method:m,body:b&&JSON.stringify(b),headers:{apikey:SB.key,...(SB.key.startsWith('eyJ')?{Authorization:'Bearer '+SB.key}:{}),'Content-Type':'application/json',...h}});if(!r.ok)throw new Error(r.status+' '+await r.text());return r.status===204?null:r.json().catch(()=>null)}
async function save(){try{if(SB.url)await api('joueurs','POST',P,{Prefer:'resolution=merge-duplicates'});else localStorage['p_'+P.pseudo]=JSON.stringify(P)}catch{}}

async function boot(){
  try{const idx=await (await fetch('content/index.json')).json();packs=await Promise.all(idx.map(f=>fetch('content/'+f).then(r=>r.json())))}catch{A.textContent='Contenu introuvable (content/index.json).';return}
  ALL=packs.flatMap(p=>p.cartes.map(c=>({...c,ch:p.id,id:p.id+':'+c.id})));
  [QCM,EXOS]=await Promise.all(['qcm_bac.json','exos_bac.json'].map(f=>fetch('content/'+f).then(r=>r.ok?r.json():[]).catch(()=>[])));
  [QCM,EXOS].forEach(L=>L.forEach(q=>q.ch=[...new Set(q.ch.map(c=>ALIAS[c]||c))]));
  const me=JSON.parse(localStorage.me||'null');
  if(me&&await login(me.pseudo,me.pin,true))return;
  loginView();
}
function loginView(e=''){R(`<h1>MathQuest</h1><p class="mut">Révise ton cours en gagnant de l'XP.</p><div class="card"><b>Ton pseudo</b><input id="ps" maxlength="20" autocomplete="off" placeholder="ex : Gauss"><b>Code PIN (4 chiffres, facultatif)</b><input id="pn" inputmode="numeric" maxlength="4" placeholder="ex : 0000"><p class="err">${e}</p><button class="btn" onclick="go()">Jouer</button><p class="mut">Pseudo existant : retape-le (et ton PIN s'il en a un) pour retrouver ta progression. N'utilise pas ton vrai nom.</p><p class="mut">MathQuest v${VERSION}</p>${SB.url?'':'<p class="mut">Mode local : Supabase n\'est pas configuré, la progression reste sur cet appareil.</p>'}</div>`);
  window.go=async()=>{const ps=ps_.value.trim(),pn=pn_.value.trim();if(!ps)return loginView('Choisis un pseudo.');const h=pn?await sha(ps.toLowerCase()+pn):'';if(!await login(ps,h))loginView(window.lastErr?'Erreur serveur : '+window.lastErr:'PIN incorrect.')}
  window.ps_=document.getElementById('ps');window.pn_=document.getElementById('pn');
}
async function login(ps,h,silent){
  let row=null;
  try{row=SB.url?(await api('joueurs?pseudo=eq.'+encodeURIComponent(ps)+'&select=*'))[0]:JSON.parse(localStorage['p_'+ps]||'null')}catch(e){window.lastErr=String(e.message||e);return false}
  if(row){if(row.pin&&row.pin!==h)return false;P=row}else P={pseudo:ps,pin:h,xp:0,xp_semaine:0,semaine:wk(),progression:{}};
  if(P.semaine!==wk()){P.semaine=wk();P.xp_semaine=0}
  localStorage.me=JSON.stringify({pseudo:ps,pin:h});await save();home();return true
}
function out(){localStorage.removeItem('me');P=null;bar();loginView()}
function mastered(ch){return ALL.filter(c=>c.ch===ch&&(P.progression[c.id]?.b||0)>=MASTER).length}
function prog(ch){const c=ALL.filter(x=>x.ch===ch);return Math.round(c.reduce((a,x)=>a+Math.min(MASTER,P.progression[x.id]?.b||0),0)/(MASTER*c.length)*100)}
function resume(){const s=P.progression._s;ev=s.ev;ALL.forEach(c=>c.again=0);const seen={};Q=s.ids.map(id=>{const c=ALL.find(x=>x.id===id);if(c&&seen[id])c.again=1;seen[id]=1;return c}).filter(Boolean);Q.ch=s.ch;qi=s.qi;combo=s.combo;gained=s.gained;good=s.good;qview()}
function bar(){const t=document.getElementById('top');if(!P){t.style.display='none';t.innerHTML='';return}
  const l=lvl(P.xp),pc=Math.min(100,(P.xp-need(l))/(need(l+1)-need(l))*100|0);t.style.display='flex';
  t.innerHTML=`<button class="tb av-b" onclick="shop()" aria-label="Mon avatar">${avatar(G().av,36)}</button><button class="tb" onclick="home()" aria-label="Accueil"><b><span class="lb">Salut </span>${esc(P.pseudo)}</b></button><button class="lv" onclick="succ()" aria-label="Succès">${ACH.some(claimable)?'<span class="dot"></span>':''}<b>Niv. ${l}</b><div class="bar"><i style="width:${pc}%"></i></div></button><nav><button class="nb pri" onclick="evalStart('all')" title="Éval" aria-label="Éval"><span class="ic">🎓</span><span class="lb">EVAL</span></button><button class="nb" onclick="board('xp')" title="Classement" aria-label="Classement"><span class="ic">🏆</span><span class="lb">Classement</span></button><button class="nb out" onclick="out()" title="Déconnexion" aria-label="Déconnexion"><span class="ic">🚪</span><span class="lb">Déconnexion</span></button></nav>`}
function home(){touchDay();bar();const due=ALL.filter(c=>!P.progression[c.id]||P.progression[c.id].due<=day()).length;
  const S=P.progression._s,sv=S?`<div class="card"><b>Séance en cours</b> <span class="mut">${S.ev?'éval':'révision'} · ${Math.min(S.qi,S.ids.length)}/${S.ids.length}</span><br><button class="btn" onclick="resume()">Reprendre</button><button class="btn alt" onclick="delete P.progression._s;save();home()">Abandonner</button></div>`:'';
  R(`${sv}<div class="card"><span class="mut">${P.xp} XP</span>${stats('all')}</div>
  <div class="row"><h2>Flash cards</h2>${due?`<button class="btn" onclick="rev('all')">Révision du jour · ${due} à revoir</button>`:''}</div>
  <div class="hs">${QCM.length?qbCard():''}${packs.map(p=>{const n=p.cartes.length;return `<div class="card ch"><b class="t">${p.titre}</b><div class="mut">${p.niveau} · ${mastered(p.id)}/${n} maîtrisées</div><div class="pr"><div class="bar"><i style="width:${prog(p.id)}%"></i></div><span>${prog(p.id)} %</span></div><div class="st">${stats(p.id)||'<div class="mut">Pas encore d\'éval</div>'}</div><div class="acts"><button class="btn alt" onclick="consult('${p.id}')">Consulter</button><button class="btn" onclick="rev('${p.id}')">Réviser</button><button class="btn alt" onclick="evalStart('${p.id}')">Éval</button></div></div>`}).join('')}</div>
  <h2>Exo express</h2><div class="card lock">🔒 Section à venir</div>
  <h2 id="xs">Exos types bac</h2>${exoSection()}
  <footer>MathQuest v${VERSION} · <button class="lnk" onclick="legal()">Crédits et mentions légales</button></footer>`,1)}
function legal(){R(`<button class="btn alt" onclick="home()">← Retour</button><h2>Crédits et mentions légales</h2><div class="card"><p><b>Éditeur :</b> ZoumB</p><p><b>Contenu des cours :</b> Merci à M. K pour les cours</p><p><b>Hébergement du site :</b> GitHub Pages (GitHub, Inc., San Francisco, États-Unis). <b>Base de données :</b> Supabase.</p><p><b>Données collectées :</b> uniquement ton pseudo, ton PIN (stocké haché), ton XP, tes scores et ta progression. Aucun nom, e-mail ni cookie publicitaire. Ton pseudo est mémorisé dans le stockage local de ton navigateur pour te reconnecter. N'utilise pas ton vrai nom.</p><p><b>Suppression :</b> pour effacer ton compte, contacte l'éditeur.</p></div>`)}
// ---- Succès, rubis, avatar, boutique (données dans progression._g)
const G=()=>P.progression._g||(P.progression._g={s:{rv:0,mc:0,ev:0,pf:0,e80:0,dd:[]},cl:{},ru:0,own:[],av:{mo:'m0',ey:'e0',ha:'h0',gl:'g0',ht:'t0',bg:'b0'}});
const rb=()=>'<span class="rb">◆</span>',RW=[5,10,20];
const ST={rv:()=>G().s.rv,mc:()=>G().s.mc,ev:()=>G().s.ev,pf:()=>G().s.pf,e80:()=>G().s.e80,dj:()=>G().s.dd.length,xp:()=>P.xp,lv:()=>lvl(P.xp),
  mt:()=>ALL.filter(c=>(P.progression[c.id]?.b||0)>=MASTER).length,cb:()=>packs.filter(p=>mastered(p.id)===p.cartes.length).length};
const ACH=[{id:'rv',n:'Bûcheur',d:'Réponds à des cartes en révision',t:[10,50,100]},{id:'mc',n:'Sans faute',d:'Bonnes réponses d\'affilée',t:[5,10,20]},
{id:'ev',n:'Évaluateur',d:'Termine des évals',t:[1,5,15]},{id:'pf',n:'Perfectionniste',d:'Score de 100 % en éval',t:[1,3,10]},
{id:'e80',n:'Tout-terrain',d:'Score d\'au moins 80 % en éval',t:[1,5,10]},{id:'mt',n:'Maître des cartes',d:'Cartes maîtrisées',t:[5,20,40]},
{id:'cb',n:'Chapitre bouclé',d:'Chapitres maîtrisés à 100 %',t:[1,2,3]},{id:'xp',n:'Chasseur d\'XP',d:'XP totale',t:[200,1000,3000]},
{id:'lv',n:'Niveau supérieur',d:'Niveau atteint',t:[3,5,10]},{id:'dj',n:'Assidu',d:'Jours différents joués',t:[3,7,14]}];
const tier=a=>a.t.filter(x=>ST[a.id]()>=x).length,claimable=a=>tier(a)>(G().cl[a.id]||0);
function touchDay(){const g=G(),d=day();if(!g.s.dd.includes(d)){g.s.dd.push(d);if(g.s.dd.length>60)g.s.dd.shift();save()}}
function claim(id){const a=ACH.find(x=>x.id===id),t=tier(a),c=G().cl[id]||0;if(t<=c)return;for(let i=c;i<t;i++)G().ru+=RW[i];G().cl[id]=t;save();bar();succ()}

  let xp=2;const was=(P.progression[cur.id]?.b||0)>=MASTER;
  if(ev){xp=ok?5*cur.d:0;if(ok){good++;combo++}else combo=0}
  else if(ok){combo++;xp=Math.round(10*cur.d*(ty?1.5:1)*Math.min(2,1+.1*(combo-1)));good++}
  else{combo=0;if(!cur.again){cur.again=1;Q.push(cur)}}
  {const s=P.progression[cur.id]||{b:0};s.b=ok?Math.min(5,s.b+1):Math.max(0,s.b-1);s.due=day()+[0,1,2,4,8,16][s.b];P.progression[cur.id]=s;if(!was&&s.b>=MASTER)nm++}
  {const g=G();if(!ev)g.s.rv++;g.s.mc=Math.max(g.s.mc,combo)}P.xp+=xp;P.xp_semaine+=xp;gained+=xp;P.progression._s={ev,ch:Q.ch,ids:Q.map(c=>c.id),qi:qi+1,combo,gained,good};save();bar();
  const fb=document.getElementById('fb');fb.innerHTML=`<div class="card pop"><b class="${ok?'':'err'}">${ok?'Juste !':'Pas tout à fait.'}</b> <span class="hl">+${xp} XP</span>${ok?'':`<p>Réponse : ${cur.a}</p>`}<button class="btn" onclick="qi++;qview()">Suivant</button></div>`;renderMathInElement(fb,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false})
}
function end(){delete P.progression._s;save();
  if(!ev)return R(`<h1>Séance terminée</h1><div class="card pop"><p><span class="hl">+${gained} XP</span></p><p>${good} bonnes réponses sur ${Q.length}.</p>${nm?`<p>🎉 ${nm} carte${nm>1?'s':''} maîtrisée${nm>1?'s':''} !</p>`:''}<button class="btn" onclick="home()">Accueil</button><button class="btn alt" onclick="board('xp')">Classement</button></div>`);
  const pc=Math.round(good/Q.length*100),L=P.progression._ev=P.progression._ev||[];L.push({c:Q.ch,s:pc,t:Date.now()});if(L.length>50)L.shift();{const g=G();g.s.ev++;if(pc===100)g.s.pf++;if(pc>=80)g.s.e80++}save();
  R(`<h1>Éval terminée</h1><div class="card pop"><p><span class="sc" style="background:${col(pc)}">${pc}%</span> &nbsp;${good}/${Q.length} · <span class="hl">+${gained} XP</span></p>${nm?`<p>🎉 ${nm} carte${nm>1?'s':''} maîtrisée${nm>1?'s':''} !</p>`:''}<button class="btn" onclick="evalStart('${Q.ch}')">Refaire une éval</button><button class="btn alt" onclick="home()">Accueil</button></div>`)
}
// ---- Éval (QCM uniquement, rejouable, sans effet sur la répétition espacée)
const col=p=>`hsl(${Math.round(p*1.2)},62%,36%)`;
function evalStart(ch){ev=true;Q=shuf(ALL.filter(c=>ch==='all'||c.ch===ch)).sort((x,y)=>(P.progression[x.id]?.b||0)-(P.progression[y.id]?.b||0)).slice(0,10);Q.ch=ch;delete P.progression._s;qi=0;combo=0;gained=0;good=0;nm=0;qview()}
function stats(ch){const L=(P.progression._ev||[]).filter(e=>ch==='all'||e.c===ch);if(!L.length)return'';const best=Math.max(...L.map(e=>e.s)),l5=L.slice(-5),avg=Math.round(l5.reduce((a,e)=>a+e.s,0)/l5.length);
  return `<div class="sts"><div><span class="mut">Meilleur éval</span><span class="sc" style="background:${col(best)}">${best}%</span></div><div><span class="mut">Moy. ${l5.length>1?l5.length+' derniers':'dernier'}</span><span class="sc" style="background:${col(avg)}">${avg}%</span></div></div>`}
// ---- Classement
const SORTS=[['fc','Flash cards'],['ds','DS'],['xp','XP']];
async function board(k){k=k||'xp';
  if(!SB.url)return R(`<button class="btn alt" onclick="home()">← Retour</button><div class="card">Le classement s'active quand Supabase est configuré (voir README).</div>`);
  let rows=[];try{rows=await api('joueurs?select=pseudo,xp,progression&order=xp.desc&limit=200')}catch{}
  rows=rows.map(r=>{const pr=r.progression||{},ev=pr._ev||[],dk=packs.map(p=>Math.round(100*p.cartes.filter(c=>(pr[p.id+':'+c.id]?.b||0)>=MASTER).length/p.cartes.length));
    return {pseudo:r.pseudo,xp:r.xp,dk,fc:dk.reduce((a,b)=>a+b,0)/(dk.length||1),ds:ev.length?Math.round(ev.reduce((a,e)=>a+e.s,0)/ev.length):null,av:(pr._g&&pr._g.av)||{}}});
  rows.sort((a,b)=>(b[k]??-1)-(a[k]??-1));const md=['🥇','🥈','🥉'];
  R(`<button class="btn alt" onclick="home()">← Retour</button><h2>Classement</h2><p class="mut">Le tri « Flash cards » utilise la moyenne des % de validation des decks (non affichée).</p>
<div class="card lbx"><div class="lbg lbh"><span></span><span>Joueur</span>${SORTS.map(([c,n])=>`<button class="sorth ${c===k?'on':''}" onclick="board('${c}')">${n} ▼</button>`).join('')}</div>
${rows.map((r,i)=>`<div class="lbg lbr ${r.pseudo===P.pseudo?'me':''}"><span class="rk">${md[i]||i+1}</span><span class="who">${avatar(r.av,32)}<b>${esc(r.pseudo)}</b></span><span class="dks">${r.dk.map((v,j)=>`<span class="sc" style="background:${col(v)}">${esc(packs[j].court||packs[j].titre)} ${v}%</span>`).join('')}</span><span>${r.ds==null?'—':`<span class="sc" style="background:${col(r.ds)}">${r.ds}%</span>`}</span><b>${r.xp}</b></div>`).join('')||'<p>Personne pour l\'instant.</p>'}</div>`,1)}
boot();
</script></body></html>
